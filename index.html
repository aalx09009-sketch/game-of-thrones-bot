<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 بوت Game of Thrones العربي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn {
            background: linear-gradient(45deg, #d4af37, #f7d44c);
            color: #2c3e50;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            display: inline-block;
            margin: 20px 0;
            font-size: 18px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }
        .stats {
            background: rgba(255,255,255,0.15);
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-right: 4px solid #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 2.5em; margin-bottom: 10px;">👑</h1>
        <h1 style="font-size: 1.8em; margin-bottom: 20px;">بوت Game of Thrones الرسمي</h1>
        <p style="font-size: 1.2em; opacity: 0.9;">انضم إلى أكثر من 100,000 مستخدم عربي</p>
        
        <div class="stats">
            <h3>📊 إحصائيات البوت:</h3>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap;">
                <div>👥 100,000+</div>
                <div>⭐ 4.8/5</div>
                <div>🌍 العالم العربي</div>
            </div>
        </div>

        <div style="text-align: right; margin: 20px 0;">
            <div class="feature">📚 اقتباسات حصرية من المسلسل</div>
            <div class="feature">🎭 معلومات عن الشخصيات والبيوت</div>
            <div class="feature">🔔 محتوى يومي جديد</div>
            <div class="feature">💬 مجتمع عربي نشط</div>
        </div>

        <a href="https://t.me/seriiess_bot" class="btn">
            🔗 انضم إلى البوت الآن
        </a>
        
        <div style="margin-top: 30px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px;">
            <h3>🎯 شارك البوت مع الأصدقاء:</h3>
            <input type="text" value="https://t.me/seriiess_bot" 
                   style="width: 90%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.9); color: #333; text-align: center; font-size: 16px;" 
                   onclick="this.select()" readonly>
            <p style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">انقر فوق الحقل ثم نسخ (Ctrl+C)</p>
        </div>
    </div>

    <script>
        // كود تتبع بسيط
        console.log('🚀 صفحة ترويج البوت جاهزة!');
        console.log('seriiess_bot');
    </script>
</body>
</html>
